name: Sanity Check

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SERVER_PORT: 8000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: cd webapp && npm ci

      - name: Build webapp
        run: cd webapp && npm run pack

      - name: Build server
        env:
          GOFLAGS: "-tags=json1,sqlite3"
        run: make server

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Start server in background
        run: |
          ./bin/focalboard-server &
          echo $! > server.pid
          # Wait for server to be ready and serving content (max ~30 seconds)
          timeout 30 bash -c '
            until curl -f -s http://localhost:${{ env.SERVER_PORT }} | grep -q "Bingusboard"; do
              sleep 1
            done
          ' || (echo "Server failed to become ready" && exit 1)

      - name: Take screenshot with Playwright
        env:
          BASE_URL: http://localhost:${{ env.SERVER_PORT }}
        run: node .github/scripts/take-screenshot.js sanity-screenshot.png

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-screenshot
          path: sanity-screenshot.png
          retention-days: 30
